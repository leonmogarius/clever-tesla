<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Brand-Safe SEO: brand name only in HTML (no gambling keywords for TrustPositif).
       Rich content is still injected by config.js at runtime for visitors. -->
  <title>LATOTO - Link Resmi</title>
  <meta name="description" content="LATOTO - Link resmi dan alternatif.">
  <link rel="canonical" href="https://latoto89.netlify.app/">

  <!-- Open Graph (brand-only) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="LATOTO - Link Resmi">
  <meta property="og:description" content="LATOTO - Link resmi dan alternatif.">
  <meta property="og:url" content="https://latoto89.netlify.app/">

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="LATOTO - Link Resmi">
  <meta name="twitter:description" content="LATOTO - Link resmi dan alternatif.">

  <!-- No industry keywords anywhere in this file -->

  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Background glow effects -->
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Main content -->
  <main class="container">
    <div class="glass-card">

      <!-- Brand name -->
      <h1 class="brand-name" id="brand-name">GATEWAY</h1>

      <!-- Hero image -->
      <div class="hero-wrap">
        <img id="hero-img" src="./assets/hero.jpg" alt="Banner" loading="eager">
      </div>

      <!-- Tagline -->
      <p class="tagline" id="tagline">Welcome</p>

      <!-- CTA + Countdown (combined) -->
      <button class="cta-btn" id="cta-btn" type="button">ENTER</button>

      <p class="countdown" id="countdown" aria-live="polite">
        Redirecting in <span id="countdown-number">5</span>s
      </p>

    </div>
  </main>

</body>
</html>
